<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="PaperLoom pipeline flow">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e75b37"/>
      <stop offset="50%" stop-color="#a36a1e"/>
      <stop offset="100%" stop-color="#2e7254"/>
    </linearGradient>
  </defs>

  <rect width="960" height="200" rx="16" fill="#f2efe7"/>

  <text x="32" y="36" fill="#71766f" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.16em">HOW IT WORKS</text>
  <text x="32" y="58" fill="#171a22" font-family="Georgia,serif" font-size="20" font-style="italic">Paper name to proof-linked site</text>

  <!-- track -->
  <rect x="32" y="108" width="896" height="6" rx="3" fill="#d8d3c9"/>
  <rect x="32" y="108" width="0" height="6" rx="3" fill="url(#track)">
    <animate attributeName="width" values="0;896;896;0" keyTimes="0;0.55;0.82;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#171a22">
    <g transform="translate(32,128)"><circle cx="0" cy="-14" r="10" fill="#171a22"/><text x="0" y="8" text-anchor="middle">Ask</text></g>
    <g transform="translate(190,128)"><circle cx="0" cy="-14" r="10" fill="#e75b37"/><text x="0" y="8" text-anchor="middle">Resolve</text></g>
    <g transform="translate(350,128)"><circle cx="0" cy="-14" r="10" fill="#a36a1e"/><text x="0" y="8" text-anchor="middle">Extract</text></g>
    <g transform="translate(510,128)"><circle cx="0" cy="-14" r="10" fill="#a36a1e"/><text x="0" y="8" text-anchor="middle">Build</text></g>
    <g transform="translate(670,128)"><circle cx="0" cy="-14" r="10" fill="#e75b37"/><text x="0" y="8" text-anchor="middle">Validate</text></g>
    <g transform="translate(830,128)"><circle cx="0" cy="-14" r="10" fill="#2e7254"/><text x="0" y="8" text-anchor="middle">Publish</text></g>
  </g>

  <circle r="9" fill="#171a22" stroke="#fbfaf6" stroke-width="2">
    <animate attributeName="cx" values="32;190;350;510;670;830;830;32" keyTimes="0;0.15;0.3;0.45;0.6;0.75;0.88;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="108;108;108;108;108;108;108;108" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
