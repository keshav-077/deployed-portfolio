<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Evidence graph hub">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e75b37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#171a22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="400" rx="16" fill="#171a22"/>

  <circle cx="480" cy="200" r="120" fill="url(#hubGlow)">
    <animate attributeName="r" values="110;130;110" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="480" cy="200" r="56" fill="#2a2d35" stroke="#e75b37" stroke-width="3">
    <animate attributeName="stroke-width" values="2;4;2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="480" y="196" text-anchor="middle" fill="#fbfaf6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Evidence</text>
  <text x="480" y="214" text-anchor="middle" fill="#71766f" font-family="system-ui,sans-serif" font-size="10">graph</text>

  <g font-family="system-ui,sans-serif" font-size="11" font-weight="600">
    <g transform="translate(80,60)"><rect width="120" height="44" rx="10" fill="#f2efe7"/><text x="60" y="28" text-anchor="middle" fill="#171a22">PDF pages</text></g>
    <g transform="translate(80,296)"><rect width="120" height="44" rx="10" fill="#f2efe7"/><text x="60" y="28" text-anchor="middle" fill="#171a22">arXiv meta</text></g>
    <g transform="translate(760,40)"><rect width="120" height="40" rx="10" fill="#3d4149"/><text x="60" y="26" text-anchor="middle" fill="#f2efe7">Report</text></g>
    <g transform="translate(760,110)"><rect width="120" height="40" rx="10" fill="#3d4149"/><text x="60" y="26" text-anchor="middle" fill="#f2efe7">Story</text></g>
    <g transform="translate(760,180)"><rect width="120" height="40" rx="10" fill="#3d4149"/><text x="60" y="26" text-anchor="middle" fill="#f2efe7">Learning</text></g>
    <g transform="translate(760,250)"><rect width="120" height="40" rx="10" fill="#3d4149"/><text x="60" y="26" text-anchor="middle" fill="#f2efe7">Playground</text></g>
    <g transform="translate(760,320)"><rect width="120" height="40" rx="10" fill="#3d4149"/><text x="60" y="26" text-anchor="middle" fill="#f2efe7">Quiz</text></g>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M200 82 C300 82, 380 140, 424 180" stroke="#e75b37" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M200 318 C300 280, 380 240, 424 210" stroke="#2e7254" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M536 200 H760" stroke="#f2efe7" stroke-dasharray="6 5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(400,340)">
    <rect width="160" height="36" rx="10" fill="#e75b37" opacity="0.2" stroke="#e75b37" stroke-width="1.5"/>
    <text x="80" y="23" text-anchor="middle" fill="#e99a82" font-family="system-ui,sans-serif" font-size="10" font-weight="700">needs-review blocked</text>
  </g>
</svg>
