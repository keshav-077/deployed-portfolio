<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="PaperLoom system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a22"/>
      <stop offset="100%" stop-color="#22262f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f2efe7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e75b37"/>
      <stop offset="100%" stop-color="#a36a1e"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#bg)"/>

  <text x="480" y="40" text-anchor="middle" fill="#f2efe7" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em">SYSTEM ARCHITECTURE</text>
  <text x="480" y="64" text-anchor="middle" fill="#71766f" font-family="Georgia,serif" font-size="22" font-style="italic">Agent in. Proof-linked site out.</text>

  <!-- Layer 1: Agents -->
  <g transform="translate(48,88)">
    <rect width="864" height="72" rx="14" fill="#2a2d35" stroke="#3d4149" stroke-width="1.5"/>
    <text x="24" y="28" fill="#71766f" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">YOUR AGENT</text>
    <rect x="24" y="38" width="120" height="28" rx="8" fill="#D97757" opacity="0.9"/>
    <text x="84" y="56" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Claude Code</text>
    <rect x="156" y="38" width="88" height="28" rx="8" fill="#412991"/>
    <text x="200" y="56" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Codex</text>
    <rect x="256" y="38" width="120" height="28" rx="8" fill="#4285F4"/>
    <text x="316" y="56" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Antigravity</text>
    <text x="840" y="56" text-anchor="end" fill="#71766f" font-family="system-ui,sans-serif" font-size="10">no extra API key</text>
  </g>

  <!-- arrow down -->
  <path d="M480 168 V192" stroke="#e75b37" stroke-width="2.5" marker-end="url(#none)">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="480" cy="200" r="4" fill="#e75b37">
    <animate attributeName="cy" values="168;200;168" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 2: Plugin -->
  <g transform="translate(200,208)">
    <rect width="560" height="64" rx="14" fill="url(#card)" stroke="#d8d3c9" stroke-width="2"/>
    <text x="24" y="26" fill="#71766f" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">PAPERLOOM PLUGIN</text>
    <text x="24" y="48" fill="#171a22" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Skill + agent script + validator</text>
    <rect x="420" y="20" width="120" height="28" rx="8" fill="#171a22"/>
    <text x="480" y="38" text-anchor="middle" fill="#fbfaf6" font-family="ui-monospace,monospace" font-size="10">paperloom-tools</text>
  </g>

  <circle cx="480" cy="290" r="4" fill="#2e7254">
    <animate attributeName="cy" values="280;300;280" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 3: Pipeline core -->
  <g transform="translate(48,304)">
    <rect width="864" height="88" rx="14" fill="#2a2d35" stroke="#3d4149" stroke-width="1.5"/>
    <text x="24" y="26" fill="#71766f" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">GENERATION PIPELINE</text>
    <g font-family="system-ui,sans-serif" font-size="10" font-weight="600">
      <rect x="24" y="36" width="100" height="40" rx="8" fill="#3d4149"/><text x="74" y="60" text-anchor="middle" fill="#f2efe7">arXiv</text>
      <rect x="136" y="36" width="100" height="40" rx="8" fill="#3d4149"/><text x="186" y="60" text-anchor="middle" fill="#f2efe7">Extract</text>
      <rect x="248" y="36" width="100" height="40" rx="8" fill="#3d4149"/><text x="298" y="60" text-anchor="middle" fill="#f2efe7">Evidence</text>
      <rect x="360" y="36" width="100" height="40" rx="8" fill="#3d4149"/><text x="410" y="60" text-anchor="middle" fill="#f2efe7">Story</text>
      <rect x="472" y="36" width="100" height="40" rx="8" fill="#3d4149"/><text x="522" y="60" text-anchor="middle" fill="#f2efe7">Learning</text>
      <rect x="584" y="36" width="100" height="40" rx="8" fill="url(#accent)"/><text x="634" y="60" text-anchor="middle" fill="#fff">Validate</text>
      <rect x="696" y="36" width="144" height="40" rx="8" fill="#2e7254"/><text x="768" y="60" text-anchor="middle" fill="#fff">.trace.json</text>
    </g>
    <rect x="24" y="82" width="0" height="3" rx="1.5" fill="#e75b37">
      <animate attributeName="width" values="0;816;816;0" keyTimes="0;0.5;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="480" cy="410" r="4" fill="#e75b37">
    <animate attributeName="cy" values="400;420;400" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 4: Outputs -->
  <g transform="translate(48,424)">
    <rect x="0" y="0" width="420" height="72" rx="14" fill="url(#card)" stroke="#d8d3c9" stroke-width="2"/>
    <text x="24" y="26" fill="#71766f" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">NEXT.JS STUDIO</text>
    <text x="24" y="50" fill="#171a22" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Lab · Story · Preview · Library</text>

    <rect x="444" y="0" width="420" height="72" rx="14" fill="url(#card)" stroke="#d8d3c9" stroke-width="2"/>
    <text x="468" y="26" fill="#71766f" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">PORTABLE VIEWER</text>
    <text x="468" y="50" fill="#171a22" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Self-contained HTML site</text>
  </g>
</svg>
