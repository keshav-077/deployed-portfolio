<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="PaperLoom workspaces">
  <rect width="960" height="360" rx="16" fill="#fbfaf6"/>

  <text x="480" y="40" text-anchor="middle" fill="#71766f" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.16em">FOUR WORKSPACES · ONE EVIDENCE GRAPH</text>

  <circle cx="480" cy="190" r="130" fill="none" stroke="#d8d3c9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="480" cy="190" r="36" fill="#171a22"/>
  <text x="480" y="186" text-anchor="middle" fill="#fbfaf6" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Evidence</text>
  <text x="480" y="200" text-anchor="middle" fill="#71766f" font-family="system-ui,sans-serif" font-size="8">hub</text>

  <g font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#171a22">
    <g transform="translate(410,62)">
      <animateTransform attributeName="transform" type="translate" values="410,62;410,54;410,62" dur="3s" repeatCount="indefinite"/>
      <rect width="140" height="56" rx="14" fill="#f2efe7" stroke="#e75b37" stroke-width="2"/>
      <text x="70" y="34" text-anchor="middle">Lab</text>
    </g>
    <g transform="translate(650,162)">
      <animateTransform attributeName="transform" type="translate" values="650,162;658,162;650,162" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <rect width="140" height="56" rx="14" fill="#f2efe7" stroke="#a36a1e" stroke-width="2"/>
      <text x="70" y="34" text-anchor="middle">Story</text>
    </g>
    <g transform="translate(410,262)">
      <animateTransform attributeName="transform" type="translate" values="410,262;410,270;410,262" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <rect width="140" height="56" rx="14" fill="#f2efe7" stroke="#2e7254" stroke-width="2"/>
      <text x="70" y="34" text-anchor="middle">Preview</text>
    </g>
    <g transform="translate(170,162)">
      <animateTransform attributeName="transform" type="translate" values="170,162;162,162;170,162" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      <rect width="140" height="56" rx="14" fill="#f2efe7" stroke="#171a22" stroke-width="2"/>
      <text x="70" y="34" text-anchor="middle">Library</text>
    </g>
  </g>

  <g fill="none" stroke-width="2" stroke-dasharray="4 4">
    <line x1="480" y1="118" x2="480" y2="154" stroke="#e75b37"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/></line>
    <line x1="550" y1="190" x2="650" y2="190" stroke="#a36a1e"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/></line>
    <line x1="480" y1="262" x2="480" y2="226" stroke="#2e7254"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/></line>
    <line x1="410" y1="190" x2="310" y2="190" stroke="#171a22"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/></line>
